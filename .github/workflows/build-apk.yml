name: Build CodeBot Android APK & Deploy Web

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Rechten voor zowel het aanmaken van GitHub Releases (contents: write) als GitHub Pages (pages/id-token)
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Code ophalen uit repository
        uses: actions/checkout@v4

      - name: 2. Node.js 22 installeren
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Java JDK 21 installeren
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Gradle installeren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 5. Capacitor, TTS Plugin, URLs, Logo & Versienummer configureren
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f woorden.json ]; then cp woorden.json www/; fi

          # 1. Bepaal het automatische versienummer op basis van het GitHub Build nummer
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="4.8.$BUILD_NUM"
          echo "✅ Automatisch versienummer ingesteld op: v$VERSION_NAME (Build code: $BUILD_NUM)"

          # 2. Injecteer het versienummer direct in de Hub van www/index.html
          sed -i "s|v4\.8|v$VERSION_NAME|g" www/index.html

          # 3. Injecteer automatisch de juiste woorden.json URL in www/index.html
          if [ -n "${{ vars.WOORDEN_JSON_URL }}" ]; then
            TARGET_URL="${{ vars.WOORDEN_JSON_URL }}"
          else
            TARGET_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/woorden.json"
          fi
          echo "✅ Woordenlijst URL automatisch ingesteld op: $TARGET_URL"
          sed -i "s|const GITHUB_PAGES_JSON_URL = .*|const GITHUB_PAGES_JSON_URL = '$TARGET_URL';|" www/index.html

          # 4. Injecteer automatisch de Firebase Realtime Database URL (checkt zowel Variables als Secrets)
          FB_URL="${{ vars.FIREBASE_DB_URL || secrets.FIREBASE_DB_URL }}"
          if [ -n "$FB_URL" ]; then
            sed -i "s|const FIREBASE_DB_URL = .*|const FIREBASE_DB_URL = '$FB_URL';|" www/index.html
            echo "✅ Firebase Highscore URL succesvol gekoppeld!"
          else
            echo "ℹ️ Geen FIREBASE_DB_URL variabele gevonden; app gebruikt lokale highscores."
          fi

          # Maak een schone kopie van de web-bestanden VOORDAT capacitor.js wordt toegevoegd
          # (Zo ziet de webbrowser dat het geen native APK is en toont hij netjes de Download-knop)
          mkdir -p web_dist
          cp -r www/* web_dist/

          # Maak package.json aan inclusief de asset-configuratie
          cat << 'EOF' > package.json
          {
            "name": "codebot-arena",
            "version": "1.0.0",
            "description": "CodeBot Gaming Hub",
            "private": true,
            "capacitor-assets": {
              "input": "assets/logo.png"
            }
          }
          EOF

          # Installeer Capacitor 6, de TTS plugin én de asset-generator
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/text-to-speech@6 @capacitor/assets --save-dev --legacy-peer-deps

          if [ -f node_modules/@capacitor/core/dist/capacitor.js ]; then
            cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
            sed -i 's|<head>|<head>\n  <script src="capacitor.js"></script>|' www/index.html
          fi

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "nl.codebot.arena",
            "appName": "CodeBot Arena",
            "webDir": "www"
          }
          EOF

          npx cap add android
          
          # Maak de assets-map aan en genereer alle Android-iconen uit logo.png
          mkdir -p assets
          if [ -f "logo.png" ]; then
            cp logo.png assets/logo.png
            echo "✅ logo.png gekopieerd naar de assets-map! Start asset generator..."
            npx capacitor-assets generate --android --assetPath assets
          else
            echo "❌ WAARSCHUWING: logo.png NIET gevonden in de root!"
            ls -la
          fi

          npx cap sync android

          # Werk ook build.gradle bij met exact hetzelfde versienummer
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUM/" "$BUILD_GRADLE"
            sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" "$BUILD_GRADLE"
            echo "✅ build.gradle succesvol bijgewerkt met versie $VERSION_NAME"
          fi

          # Forceer stabiele Gradle distributie in het Android project
          echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-all.zip" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties

      - name: 6. Bouw de Android Release APK
        run: |
          cd android
          chmod +x gradlew
          gradle assembleRelease --no-daemon

      - name: 7. APK Digitaal Ondertekenen & Klaarzetten voor Web/Releases
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android/app/build/outputs/apk/release
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          echo "✅ Gebruik Android build tools vanuit: $BUILD_TOOLS"
          
          $BUILD_TOOLS/zipalign -v -p 4 app-release-unsigned.apk app-release-aligned.apk
          
          $BUILD_TOOLS/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out CodeBot-Arena.apk \
            app-release-aligned.apk
            
          rm keystore.jks

          # Kopieer ook als app-release.apk én plaats CodeBot-Arena.apk in web_dist voor GitHub Pages
          cp CodeBot-Arena.apk app-release.apk
          cp CodeBot-Arena.apk ../../../../../../web_dist/CodeBot-Arena.apk
          echo "✅ CodeBot-Arena.apk klaargezet voor Releases en GitHub Pages!"

      - name: 8. Zet de ondertekende APK klaar als Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeBot-Arena-Android-APK
          path: android/app/build/outputs/apk/release/CodeBot-Arena.apk

      - name: 9. Publiceer APK onder GitHub Releases (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.8.${{ github.run_number }}
          name: "CodeBot Arena v4.8.${{ github.run_number }}"
          body: |
            🎮 **CodeBot Gaming Hub — Automatische Release (v4.8.${{ github.run_number }})**
            
            Klik hieronder onder **Assets** op **`CodeBot-Arena.apk`** om het spel direct op een Android-tablet of telefoon te downloaden en installeren.
          files: |
            android/app/build/outputs/apk/release/CodeBot-Arena.apk
          make_latest: true

      - name: 10. Bereid GitHub Pages voor
        uses: actions/configure-pages@v5

      - name: 11. Upload Web-App + APK naar GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web_dist'

  # Tweede job: zet de bijgewerkte webversie (inclusief CodeBot-Arena.apk) direct live op GitHub Pages
  deploy-web:
    needs: build-android
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 12. Deploy naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
