name: Build CodeBot Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  # Onderdrukt de Node 20 -> 24 waarschuwingen van oudere community actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Code ophalen uit repository
        uses: actions/checkout@v4

      - name: 2. Node.js 22 installeren
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Java JDK 21 installeren
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Capacitor & Native TTS Plugin configureren
        run: |
          # Maak de web-map aan en kopieer je spelbestanden
          mkdir -p www
          cp index.html www/
          if [ -f woorden.json ]; then cp woorden.json www/; fi

          # Maak een schone package.json aan
          cat << 'EOF' > package.json
          {
            "name": "codebot-arena",
            "version": "1.0.0",
            "description": "CodeBot Gaming Hub",
            "private": true
          }
          EOF

          # Installeer Capacitor 6 en de Text-to-Speech plugin (met legacy-peer-deps tegen conflicten)
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/text-to-speech@6 --legacy-peer-deps

          # Kopieer de gecompileerde Capacitor browser-runtime naar www en injecteer deze in index.html
          if [ -f node_modules/@capacitor/core/dist/capacitor.js ]; then
            cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
            sed -i 's|<head>|<head>\n  <script src="capacitor.js"></script>|' www/index.html
          fi

          # Maak de Capacitor configuratie aan
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "nl.codebot.arena",
            "appName": "CodeBot Arena",
            "webDir": "www"
          }
          EOF

          # Genereer en synchroniseer het Android project
          npx cap add android
          npx cap sync android

      - name: 5. Bouw het Android APK-bestand
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 6. Zet de APK klaar als Download (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CodeBot-Arena-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
