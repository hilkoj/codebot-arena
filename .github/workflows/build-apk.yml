name: Build CodeBot Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Code ophalen uit repository
        uses: actions/checkout@v4

      - name: 2. Node.js 22 installeren
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Java JDK 21 installeren
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Gradle installeren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 5. Capacitor, TTS Plugin, Logo & Versienummer configureren
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f woorden.json ]; then cp woorden.json www/; fi

          # Maak package.json aan inclusief de asset-configuratie
          cat << 'EOF' > package.json
          {
            "name": "codebot-arena",
            "version": "1.0.0",
            "description": "CodeBot Gaming Hub",
            "private": true,
            "capacitor-assets": {
              "input": "assets/logo.png"
            }
          }
          EOF

          # Installeer Capacitor 6, de TTS plugin én de asset-generator
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/text-to-speech@6 @capacitor/assets --save-dev --legacy-peer-deps

          if [ -f node_modules/@capacitor/core/dist/capacitor.js ]; then
            cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
            sed -i 's|<head>|<head>\n  <script src="capacitor.js"></script>|' www/index.html
          fi

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "nl.codebot.arena",
            "appName": "CodeBot Arena",
            "webDir": "www"
          }
          EOF

          npx cap add android
          
          # MAAK DE ASSETS-MAP AAN EN KOPIEER LOGO.PNG DAARIN
          mkdir -p assets
          if [ -f "logo.png" ]; then
            cp logo.png assets/logo.png
            echo "✅ logo.png gekopieerd naar de assets-map! Start asset generator..."
            npx capacitor-assets generate --android --assetPath assets
          else
            echo "❌ WAARSCHUWING: logo.png NIET gevonden in de root!"
            ls -la
          fi

          npx cap sync android

          # Automatisch uniek versienummer instellen op basis van GitHub Build nummer
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="3.9.$BUILD_NUM"
          echo "Automatisch versienummer ingesteld op: $VERSION_NAME (Code: $BUILD_NUM)"
          
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUM/" "$BUILD_GRADLE"
            sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" "$BUILD_GRADLE"
            echo "build.gradle succesvol bijgewerkt met versie $VERSION_NAME"
          fi

          # Forceer stabiele Gradle distributie in het Android project
          echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-all.zip" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties

      - name: 6. Bouw de Android Release APK
        run: |
          cd android
          chmod +x gradlew
          gradle assembleRelease --no-daemon
    
      - name: 7. APK Digitaal Ondertekenen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Ga naar de map waar Gradle de release APK heeft gebouwd
          cd android/app/build/outputs/apk/release
          
          # 1. Zet de Base64 tekst veilig terug naar een fysiek .jks sleutelbestand
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          
          # 2. Zoek automatisch de allernieuwste Android Build Tools map op de server
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          echo "✅ Gebruik Android build tools vanuit: $BUILD_TOOLS"
          
          # 3. Zipalign (optimaliseert het geheugengebruik van de APK)
          $BUILD_TOOLS/zipalign -v -p 4 app-release-unsigned.apk app-release-aligned.apk
          
          # 4. Apksigner (Ondertekenen met jouw unieke keystore)
          $BUILD_TOOLS/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app-release.apk \
            app-release-aligned.apk
            
          # 5. Keystore direct verwijderen voor de veiligheid
          rm keystore.jks
    
      - name: 8. Zet de ondertekende APK klaar als Download
        uses: actions/upload-artifact@v4
        with:
          name: CodeBot-Arena-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
